<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فشرده‌سازی تصویر آنلاین رایگان | NABZ Tools</title><meta name="description" content="کاهش حجم JPG، PNG و WebP داخل مرورگر، بدون آپلود تصویر."><link rel="stylesheet" href="../style.css"></head><body><main class="tools tool-card"><a href="../">← بازگشت</a><h1>فشرده‌سازی تصویر</h1><div class="card"><input id="file" type="file" accept="image/*"><br><br><label>کیفیت: <input id="quality" type="range" min="0.2" max="1" step="0.05" value="0.75"> <b id="qv">75%</b></label><div class="actions"><button class="btn" id="go" disabled>فشرده کن</button><a class="btn" id="download" hidden>دانلود تصویر</a></div><p id="info" class="muted"></p><canvas id="canvas" hidden></canvas></div></main><script>const file=document.querySelector('#file'),go=document.querySelector('#go'),quality=document.querySelector('#quality'),qv=document.querySelector('#qv'),download=document.querySelector('#download'),info=document.querySelector('#info'),canvas=document.querySelector('#canvas');let selected=null;quality.oninput=()=>qv.textContent=Math.round(quality.value*100)+'%';file.onchange=()=>{selected=file.files[0]||null;go.disabled=!selected;download.hidden=true;info.textContent=selected?'حجم اولیه: '+(selected.size/1024).toFixed(1)+' KB':''};go.onclick=()=>{if(!selected)return;const img=new Image(),url=URL.createObjectURL(selected);img.onload=()=>{const max=2400,scale=Math.min(1,max/img.width,max/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob){info.textContent='فشرده‌سازی انجام نشد.';return}const out=URL.createObjectURL(blob);download.href=out;download.download='nabz-compressed.webp';download.hidden=false;info.textContent='نتیجه: '+(blob.size/1024).toFixed(1)+' KB — '+canvas.width+'×'+canvas.height},'image/webp',Number(quality.value))};img.src=url};</script></body></html>
