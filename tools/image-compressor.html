<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فشرده‌سازی تصویر آنلاین رایگان | NABZ Tools</title><meta name="description" content="کاهش حجم تصویر داخل مرورگر، بدون آپلود به سرور."><link rel="stylesheet" href="../style.css"></head>
<body><main class="tools tool-card"><a href="../">← بازگشت</a><h1>فشرده‌سازی تصویر</h1><div class="card"><input id="file" type="file" accept="image/*"><p><label>کیفیت: <input id="q" type="range" min="0.2" max="1" step="0.05" value="0.75"> <b id="qv">75%</b></label></p><p><label>حداکثر ضلع: <input id="max" type="number" min="100" max="10000" value="2400"> px</label></p><p><label>فرمت: <select id="fmt"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label></p><button class="btn" id="go" disabled>فشرده کن</button><a class="btn" id="dl" hidden>دانلود</a><p id="info" class="muted"></p></div></main>
<script>
const $=s=>document.querySelector(s),f=$('#file'),q=$('#q'),qv=$('#qv'),max=$('#max'),fmt=$('#fmt'),go=$('#go'),dl=$('#dl'),info=$('#info');let file=null,img=new Image();
q.oninput=()=>qv.textContent=Math.round(q.value*100)+'%';f.onchange=()=>{file=f.files[0]||null;go.disabled=!file;if(file){const u=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(u);img.src=u}};
go.onclick=()=>{if(!file)return;const m=Math.max(100,+max.value||2400),s=Math.min(1,m/img.naturalWidth,m/img.naturalHeight),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));const x=c.getContext('2d');if(fmt.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b){info.textContent='فشرده‌سازی ناموفق بود.';return}if(dl.href)URL.revokeObjectURL(dl.href);dl.href=URL.createObjectURL(b);dl.download='nabz-compressed.'+(fmt.value==='image/jpeg'?'jpg':fmt.value.split('/')[1]);dl.hidden=false;const pct=(1-b.size/file.size)*100;info.textContent='حجم اولیه: '+(file.size/1024).toFixed(1)+' KB | خروجی: '+(b.size/1024).toFixed(1)+' KB | تغییر: '+pct.toFixed(1)+'%'},fmt.value,fmt.value==='image/png'?undefined:+q.value)};
</script></body></html>
