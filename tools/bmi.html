<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه BMI آنلاین رایگان | شاخص توده بدنی | NABZ Tools</title><meta name="description" content="محاسبه شاخص توده بدنی BMI بر اساس وزن و قد، رایگان و داخل مرورگر."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/bmi.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="محاسبه BMI آنلاین رایگان | شاخص توده بدنی | NABZ Tools"><meta property="og:description" content="محاسبه شاخص توده بدنی BMI بر اساس وزن و قد، رایگان و داخل مرورگر."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/bmi.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>محاسبه BMI</h1><p class="seo-intro">وزن و قد را وارد کن تا BMI محاسبه شود. این عدد یک شاخص عمومی است و به‌تنهایی تشخیص پزشکی یا ارزیابی کامل وضعیت سلامت محسوب نمی‌شود.</p><input id="w" type="number" placeholder="وزن (کیلوگرم)"><input id="h" type="number" placeholder="قد (سانتی‌متر)"><button onclick="calc()">محاسبه BMI</button><p id="o"></p><script>const weight=document.querySelector('#w'),height=document.querySelector('#h'),output=document.querySelector('#o');function calc(){let W=+weight.value,H=+height.value/100;if(W<=0||H<=0)return;output.textContent="BMI: "+(W/(H*H)).toFixed(1)}</script></main></body></html>
