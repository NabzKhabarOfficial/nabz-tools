<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه BMI | NABZ Tools</title><meta name="description" content="محاسبه شاخص توده بدنی BMI بر اساس قد و وزن."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>محاسبه BMI</h1><input id="w" type="number" placeholder="وزن (کیلوگرم)"><input id="h" type="number" placeholder="قد (سانتی‌متر)"><button onclick="calc()">محاسبه BMI</button><p id="o"></p><script>function calc(){let W=+w.value,H=+h.value/100;if(W<=0||H<=0)return;o.textContent="BMI: "+(W/(H*H)).toFixed(1)}</script></main></body></html>
