<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Encoder Decoder | NABZ Tools</title><meta name="description" content="تبدیل متن به Base64 و برعکس، رایگان و داخل مرورگر."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>Base64 Encoder / Decoder</h1><textarea id="i" placeholder="متن..."></textarea><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button><textarea id="o" readonly></textarea><script>function enc(){o.value=btoa(unescape(encodeURIComponent(i.value)))}function dec(){try{o.value=decodeURIComponent(escape(atob(i.value)))}catch(e){o.value="Base64 نامعتبر است."}}</script></main></body></html>
