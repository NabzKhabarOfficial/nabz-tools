<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Encoder Decoder آنلاین رایگان | NABZ Tools</title><meta name="description" content="تبدیل متن به Base64 و Decode کردن Base64 به متن، رایگان و داخل مرورگر."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/base64.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="Base64 Encoder Decoder آنلاین رایگان | NABZ Tools"><meta property="og:description" content="تبدیل متن به Base64 و Decode کردن Base64 به متن، رایگان و داخل مرورگر."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/base64.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>Base64 Encoder / Decoder</h1><p class="seo-intro">برای Encode یا Decode کردن متن از این ابزار سبک استفاده کن. عملیات در مرورگر انجام می‌شود و نیازی به ارسال متن به سرور نیست.</p><textarea id="i" placeholder="متن..."></textarea><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button><textarea id="o" readonly></textarea><script>const input=document.querySelector('#i'),output=document.querySelector('#o');function enc(){output.value=btoa(unescape(encodeURIComponent(input.value)))}function dec(){try{output.value=decodeURIComponent(escape(atob(input.value)))}catch(e){output.value="Base64 نامعتبر است."}}</script></main></body></html>
