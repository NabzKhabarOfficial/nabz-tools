<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه حقوق و مالیات ۱۴۰۵ | NABZ Tools</title><meta name="description" content="محاسبه حقوق خالص، بیمه ۷ درصد و مالیات پلکانی حقوق ۱۴۰۵."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/salary-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/pro4.css"></head><body class="tool-body"><header class="tool-top"><a class="logo" href="../"><b>NABZ</b> Tools</a><div class="tool-top-actions"><a class="tool-top-link" href="../">همه ابزارها</a><button id="themeToggle" class="theme-btn">☾</button></div></header><main class="tool-page"><h1>محاسبه حقوق و مالیات ۱۴۰۵</h1><p class="seo-intro">معافیت ماهانه ۴۰ میلیون تومان و نرخ‌های پلکانی ۱۰ تا ۳۰ درصد.</p><div class="card nz-panel"><label>حقوق و مزایا (تومان)<input id="g" data-money value="30,000,000"></label><div class="nz-row3"><label>مزایای مشمول مالیات<input id="x" data-money></label><label>بیمه کارگر ٪<input id="i" value="7"></label><label>معافیت بیمه<select id="e"><option value="27">۲/۷ بیمه</option><option value="all">کل بیمه</option><option value="none">بدون معافیت</option></select></label></div></div><div class="nz-result"><span>حقوق خالص</span><strong id="out">—</strong><small id="sub"></small></div><div class="card nz-panel"><table class="nz-kv"><tbody id="tb"></tbody></table></div><p class="nz-note">برای فیش رسمی، نتیجه را با واحد حسابداری تطبیق بده. جدول ۱۴۰۵: تا ۴۰ میلیون معاف، سپس ۱۰، ۱۵، ۲۰، ۲۵ و ۳۰ درصد.</p></main><script src="../assets/nabz.js"></script><script>var $=function(i){return document.getElementById(i)},v=function(i){var x=NZ.num($(i).value);return isFinite(x)?x:0};function c(){var g=v('g'),x=v('x'),ins=g*v('i')/100,ex=e.value==='27'?ins*2/7:e.value==='all'?ins:0,b=Math.max(0,g+x-ex),tax=0,lo=40e6,br=[[80e6,.1],[100e6,.15],[120e6,.2],[140e6,.25],[Infinity,.3]];br.forEach(function(z){if(b>lo){tax+=(Math.min(b,z[0])-lo)*z[1];lo=z[0]}});var net=g+x-ins-tax;out.textContent=NZ.money(Math.round(net))+' تومان';sub.textContent='مالیات: '+NZ.money(Math.round(tax))+' تومان | بیمه: '+NZ.money(Math.round(ins))+' تومان';tb.innerHTML=[['حقوق ناخالص',g+x],['بیمه کارگر',ins],['درآمد مشمول',b],['مالیات',tax],['حقوق خالص',net]].map(function(z){return '<tr><td>'+z[0]+'</td><td>'+NZ.money(Math.round(z[1]))+' تومان</td></tr>'}).join('')}['g','x','i','e'].forEach(function(i){$(i).addEventListener('input',c);$(i).addEventListener('change',c)});c()</script></body></html>
