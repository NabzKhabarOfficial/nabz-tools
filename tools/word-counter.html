<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شمارشگر متن | NABZ Tools</title><meta name="description" content="شمارش رایگان کلمات و کاراکترهای متن."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>شمارشگر متن</h1><textarea id="text" placeholder="متن خود را اینجا وارد کنید..." style="width:100%;min-height:280px;padding:18px;border:1px solid #ddd;border-radius:12px;font:inherit"></textarea><div class="grid" style="margin-top:20px"><div class="card"><h3>کلمات</h3><strong id="words">0</strong></div><div class="card"><h3>کاراکترها</h3><strong id="chars">0</strong></div></div></main><script>const t=document.querySelector('#text');function count(){const s=t.value.trim();document.querySelector('#words').textContent=s?s.split(/\s+/).length:0;document.querySelector('#chars').textContent=t.value.length}t.addEventListener('input',count)</script></body></html>
