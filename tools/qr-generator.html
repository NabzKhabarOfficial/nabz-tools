<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت QR Code آنلاین رایگان | NABZ Tools</title><meta name="description" content="ساخت QR Code برای متن و لینک به‌صورت رایگان و داخل مرورگر، بدون ارسال محتوای شما به سرویس QR خارجی."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/qr-generator.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="ساخت QR Code آنلاین رایگان | NABZ Tools"><meta property="og:description" content="ساخت QR Code برای متن و لینک به‌صورت رایگان و داخل مرورگر، بدون ارسال محتوای شما به سرویس QR خارجی."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/qr-generator.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools tool-card"><a href="../">← بازگشت</a><h1>ساخت QR Code</h1><p class="seo-intro">هر متن یا لینک را به QR Code تبدیل کن و تصویر آن را دانلود کن. کتابخانه QR به‌صورت محلی در سایت قرار دارد و محتوای واردشده برای تولید QR به سرویس خارجی ارسال نمی‌شود.</p><div class="card"><label for="x">متن یا لینک</label><input id="x" maxlength="2000" placeholder="https://example.com" style="width:100%;padding:14px;margin-top:8px"><div id="q" style="margin:25px 0;text-align:center"></div><a class="btn" id="dl" hidden>دانلود QR</a><p class="muted">پردازش QR داخل مرورگر انجام می‌شود و متن شما به سرویس QR خارجی ارسال نمی‌شود.</p></div></main><script src="../assets/qrcode.min.js"></script><script>const x=document.querySelector('#x'),q=document.querySelector('#q'),dl=document.querySelector('#dl');function make(){q.innerHTML='';dl.hidden=true;if(!x.value.trim())return;try{new QRCode(q,{text:x.value,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{const canvas=q.querySelector('canvas');if(canvas){dl.href=canvas.toDataURL('image/png');dl.download='nabz-qrcode.png';dl.hidden=false}},50);}catch(e){q.textContent='متن واردشده برای این QR بیش از ظرفیت است.'}}x.addEventListener('input',make);</script></body></html>
