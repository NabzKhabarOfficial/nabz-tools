<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت QR Code رایگان | NABZ Tools</title><meta name="description" content="ساخت QR Code رایگان برای متن و لینک، بدون ارسال داده به سرویس خارجی."><link rel="stylesheet" href="../style.css"></head><body><main class="tools tool-card"><a href="../">← بازگشت</a><h1>ساخت QR Code</h1><div class="card"><label for="x">متن یا لینک</label><input id="x" maxlength="2000" placeholder="https://example.com" style="width:100%;padding:14px;margin-top:8px"><div id="q" style="margin:25px 0;text-align:center"></div><p class="muted">پردازش QR داخل مرورگر انجام می‌شود و متن شما به سرویس QR خارجی ارسال نمی‌شود.</p></div></main><script src="../assets/qrcode.min.js"></script><script>const x=document.querySelector('#x'),q=document.querySelector('#q');function make(){q.innerHTML='';if(!x.value.trim())return;try{new QRCode(q,{text:x.value,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.textContent='متن واردشده برای این QR بیش از ظرفیت است.'}}x.addEventListener('input',make);</script></body></html>
