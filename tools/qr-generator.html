<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت QR Code | NABZ Tools</title><meta name="description" content="ساخت QR Code برای متن و لینک."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>ساخت QR Code</h1><div class="card"><input id="x" placeholder="متن یا لینک" style="width:100%;padding:14px;font:inherit"><div id="q" style="margin:25px 0"></div></div></main><script>const x=document.querySelector('#x'),q=document.querySelector('#q');function make(){q.innerHTML=x.value?'<img alt="QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(x.value)+'">':''}x.addEventListener('input',make)</script></body></html>
