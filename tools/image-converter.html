<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبدیل فرمت عکس آنلاین رایگان | NABZ Tools</title><meta name="description" content="تبدیل تصویر بین WebP، JPG و PNG به‌صورت آنلاین و رایگان، بدون آپلود تصویر به سرور."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/image-converter.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="تبدیل فرمت عکس آنلاین رایگان | NABZ Tools"><meta property="og:description" content="تبدیل تصویر بین WebP، JPG و PNG به‌صورت آنلاین و رایگان، بدون آپلود تصویر به سرور."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/image-converter.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head>
<body><main class="tools tool-card"><a href="../">← بازگشت</a><h1>تبدیل فرمت تصویر</h1><p class="seo-intro">تصویر را به WebP، JPG یا PNG تبدیل کن و کیفیت خروجی را کنترل کن. فایل انتخابی برای این تبدیل در مرورگر پردازش می‌شود.</p><div class="card"><input id="file" type="file" accept="image/*"><p><label>فرمت خروجی: <select id="fmt"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label></p><label id="ql">کیفیت: <input id="q" type="range" min="0.2" max="1" step="0.05" value="0.85"> <b id="qv">85%</b></label><div class="actions"><button class="btn" id="go" disabled>تبدیل</button><a class="btn" id="dl" hidden>دانلود</a></div><p id="info" class="muted"></p><img id="pre" alt="پیش‌نمایش" style="max-width:100%;margin-top:1rem;border-radius:12px"></div></main>
<script>
const $=s=>document.querySelector(s),f=$('#file'),fmt=$('#fmt'),q=$('#q'),qv=$('#qv'),ql=$('#ql'),go=$('#go'),dl=$('#dl'),info=$('#info'),pre=$('#pre');let img=new Image(),file=null;
q.oninput=()=>qv.textContent=Math.round(q.value*100)+'%';fmt.onchange=()=>ql.hidden=fmt.value==='image/png';
f.onchange=()=>{file=f.files[0]||null;go.disabled=!file;if(file){const u=URL.createObjectURL(file);img.onload=()=>{pre.src=img.src;URL.revokeObjectURL(u)};img.src=u}};
go.onclick=()=>{if(!file)return;const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');if(fmt.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0);c.toBlob(b=>{if(!b)return;if(dl.href)URL.revokeObjectURL(dl.href);dl.href=URL.createObjectURL(b);dl.download='nabz-converted.'+(fmt.value==='image/jpeg'?'jpg':fmt.value.split('/')[1]);dl.hidden=false;info.textContent='تبدیل شد: '+(b.size/1024).toFixed(1)+' KB'},fmt.value,fmt.value==='image/png'?undefined:+q.value)};
</script></body></html>
