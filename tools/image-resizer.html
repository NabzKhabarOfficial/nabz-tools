<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تغییر اندازه عکس آنلاین رایگان | NABZ Tools</title><meta name="description" content="تغییر عرض و ارتفاع عکس آنلاین با حفظ نسبت تصویر و انتخاب فرمت خروجی، رایگان و مرورگرمحور."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/image-resizer.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="تغییر اندازه عکس آنلاین رایگان | NABZ Tools"><meta property="og:description" content="تغییر عرض و ارتفاع عکس آنلاین با حفظ نسبت تصویر و انتخاب فرمت خروجی، رایگان و مرورگرمحور."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/image-resizer.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"NABZ Tools","item":"https://nabzkhabarofficial.github.io/nabz-tools/"},{"@type":"ListItem","position":2,"name":"تغییر اندازه تصویر","item":"https://nabzkhabarofficial.github.io/nabz-tools/tools/image-resizer.html"}]}</script></head>
<body><main class="tools tool-card"><a href="../">← بازگشت</a><h1>تغییر اندازه تصویر</h1><p class="seo-intro">یک تصویر انتخاب کن، ابعاد دلخواه را مشخص کن و در صورت نیاز نسبت تصویر را حفظ کن. فایل خروجی در مرورگر ساخته می‌شود.</p><div class="card">
<input id="file" type="file" accept="image/*"><div id="panel" hidden>
<p><label>عرض: <input id="w" type="number" min="1"></label> px</p><p><label>ارتفاع: <input id="h" type="number" min="1"></label> px</p>
<label><input id="lock" type="checkbox" checked> حفظ نسبت تصویر</label>
<p><label>فرمت خروجی: <select id="fmt"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label></p>
<label id="ql">کیفیت: <input id="q" type="range" min="0.2" max="1" step="0.05" value="0.85"> <b id="qv">85%</b></label>
<div class="actions"><button class="btn" id="go">تغییر اندازه</button><a class="btn" id="dl" hidden>دانلود</a></div><p id="info" class="muted"></p><img id="preview" alt="پیش‌نمایش" style="max-width:100%;margin-top:1rem;border-radius:12px"></div></div><section class="related-tools"><h2>ابزارهای مرتبط</h2><div class="grid related-grid"><a class="card related-tool" href="./image-compressor.html"><strong>فشرده‌سازی تصویر</strong><span>ابزار کاربردی مرتبط</span></a><a class="card related-tool" href="./image-converter.html"><strong>تبدیل فرمت تصویر</strong><span>ابزار کاربردی مرتبط</span></a><a class="card related-tool" href="./pdf-tools.html"><strong>ابزارهای PDF</strong><span>ابزار کاربردی مرتبط</span></a></div></section></main>
<script>
const $=s=>document.querySelector(s),f=$('#file'),w=$('#w'),h=$('#h'),lock=$('#lock'),fmt=$('#fmt'),q=$('#q'),qv=$('#qv'),ql=$('#ql'),go=$('#go'),dl=$('#dl'),info=$('#info'),pre=$('#preview');let img=new Image(),ratio=1;
f.onchange=()=>{const x=f.files[0];if(!x)return;const u=URL.createObjectURL(x);img.onload=()=>{URL.revokeObjectURL(u);w.value=img.width;h.value=img.height;ratio=img.width/img.height;$('#panel').hidden=false;pre.src=img.src};img.src=u};
w.oninput=()=>{if(lock.checked)h.value=Math.max(1,Math.round(w.value/ratio))};h.oninput=()=>{if(lock.checked)w.value=Math.max(1,Math.round(h.value*ratio))};
q.oninput=()=>qv.textContent=Math.round(q.value*100)+'%';fmt.onchange=()=>{ql.hidden=fmt.value==='image/png'};
go.onclick=()=>{if(!f.files[0])return;const c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b){info.textContent='ساخت فایل ناموفق بود.';return}if(dl.href)URL.revokeObjectURL(dl.href);dl.href=URL.createObjectURL(b);const ext=fmt.value.split('/')[1].replace('jpeg','jpg');dl.download='nabz-resized.'+ext;dl.hidden=false;info.textContent='خروجی: '+c.width+'×'+c.height+' — '+(b.size/1024).toFixed(1)+' KB'},fmt.value,fmt.value==='image/png'?undefined:+q.value)};
</script></body></html>
