<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter | NABZ Tools</title><meta name="description" content="فرمت و اعتبارسنجی JSON به‌صورت رایگان داخل مرورگر."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>JSON Formatter</h1><textarea id="i" placeholder='{"name":"NABZ"}'></textarea><button onclick="fmt()">فرمت JSON</button><button onclick="min()">فشرده‌سازی</button><pre id="o"></pre><script>function fmt(){try{o.textContent=JSON.stringify(JSON.parse(i.value),null,2)}catch(e){o.textContent="JSON نامعتبر است"}}function min(){try{o.textContent=JSON.stringify(JSON.parse(i.value))}catch(e){o.textContent="JSON نامعتبر است"}}</script></main></body></html>
