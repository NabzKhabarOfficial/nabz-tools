<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter | NABZ Tools</title><meta name="description" content="فرمت و اعتبارسنجی JSON به‌صورت رایگان داخل مرورگر."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>JSON Formatter</h1><textarea id="i" placeholder='{"name":"NABZ"}'></textarea><button onclick="fmt()">فرمت JSON</button><button onclick="min()">فشرده‌سازی</button><pre id="o"></pre><script>const input=document.querySelector('#i'),output=document.querySelector('#o');function fmt(){try{output.textContent=JSON.stringify(JSON.parse(input.value),null,2)}catch(e){output.textContent="JSON نامعتبر است"}}function min(){try{output.textContent=JSON.stringify(JSON.parse(input.value))}catch(e){output.textContent="JSON نامعتبر است"}}</script></main></body></html>
