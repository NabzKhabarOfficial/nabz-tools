<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter و Validator آنلاین رایگان | NABZ Tools</title><meta name="description" content="فرمت، مرتب‌سازی و فشرده‌سازی JSON به‌صورت آنلاین و رایگان داخل مرورگر."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/json-formatter.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="JSON Formatter و Validator آنلاین رایگان | NABZ Tools"><meta property="og:description" content="فرمت، مرتب‌سازی و فشرده‌سازی JSON به‌صورت آنلاین و رایگان داخل مرورگر."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/json-formatter.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>JSON Formatter</h1><p class="seo-intro">JSON خود را وارد کن تا ساختار آن مرتب یا فشرده شود. اعتبار JSON نیز هنگام پردازش بررسی می‌شود و داده‌ها به سرویس خارجی ارسال نمی‌شوند.</p><textarea id="i" placeholder='{"name":"NABZ"}'></textarea><button onclick="fmt()">فرمت JSON</button><button onclick="min()">فشرده‌سازی</button><pre id="o"></pre><script>const input=document.querySelector('#i'),output=document.querySelector('#o');function fmt(){try{output.textContent=JSON.stringify(JSON.parse(input.value),null,2)}catch(e){output.textContent="JSON نامعتبر است"}}function min(){try{output.textContent=JSON.stringify(JSON.parse(input.value))}catch(e){output.textContent="JSON نامعتبر است"}}</script></main></body></html>
