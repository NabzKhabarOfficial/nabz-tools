<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبدیل واحد | NABZ Tools</title><meta name="description" content="تبدیل متر، کیلومتر، سانتی‌متر و مایل به صورت رایگان."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>تبدیل واحد طول</h1><div class="card"><input id="v" type="number" value="1" style="padding:10px"><select id="u" style="padding:10px"><option value="m">متر</option><option value="km">کیلومتر</option><option value="cm">سانتی‌متر</option><option value="mi">مایل</option></select><h2 id="r"></h2></div></main><script>function c(){let x=+v.value,f={m:1,km:1000,cm:.01,mi:1609.344}[u.value];r.textContent='متر: '+(x*f)}v.oninput=u.onchange=c;c()</script></body></html>
