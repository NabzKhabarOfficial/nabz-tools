<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه سن | NABZ Tools</title><meta name="description" content="محاسبه سن بر اساس تاریخ تولد، رایگان و داخل مرورگر."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>محاسبه سن</h1><label>تاریخ تولد <input id="b" type="date"></label><button onclick="calc()">محاسبه</button><p id="o"></p><script>function calc(){let x=new Date(b.value),n=new Date();if(isNaN(x))return;let age=n.getFullYear()-x.getFullYear();if(n<new Date(n.getFullYear(),x.getMonth(),x.getDate()))age--;o.textContent="سن: "+age+" سال"}</script></main></body></html>
