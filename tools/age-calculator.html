<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه سن آنلاین رایگان | NABZ Tools</title><meta name="description" content="محاسبه سن بر اساس تاریخ تولد به‌صورت سریع و رایگان در مرورگر."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/age-calculator.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="محاسبه سن آنلاین رایگان | NABZ Tools"><meta property="og:description" content="محاسبه سن بر اساس تاریخ تولد به‌صورت سریع و رایگان در مرورگر."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/age-calculator.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>محاسبه سن</h1><p class="seo-intro">تاریخ تولد را انتخاب کن تا سن بر اساس تاریخ فعلی محاسبه شود. برای نتیجه دقیق، تاریخ تولد صحیح را وارد کن.</p><label>تاریخ تولد <input id="b" type="date"></label><button onclick="calc()">محاسبه</button><p id="o"></p><script>const birth=document.querySelector('#b'),output=document.querySelector('#o');function calc(){let x=new Date(birth.value),n=new Date();if(Number.isNaN(x.getTime()))return;let age=n.getFullYear()-x.getFullYear();if(n<new Date(n.getFullYear(),x.getMonth(),x.getDate()))age--;output.textContent="سن: "+Math.max(0,age)+" سال"}</script></main></body></html>
