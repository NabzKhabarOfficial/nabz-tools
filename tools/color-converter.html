<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مبدل HEX و RGB آنلاین رایگان | NABZ Tools</title><meta name="description" content="تبدیل رنگ بین HEX و RGB و مشاهده پیش‌نمایش رنگ به‌صورت آنلاین و رایگان."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/color-converter.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="مبدل HEX و RGB آنلاین رایگان | NABZ Tools"><meta property="og:description" content="تبدیل رنگ بین HEX و RGB و مشاهده پیش‌نمایش رنگ به‌صورت آنلاین و رایگان."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/color-converter.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>مبدل HEX و RGB</h1><p class="seo-intro">کد HEX یا مقادیر RGB را وارد کن تا مقدار معادل نمایش داده شود و رنگ را در پیش‌نمایش ببین. مناسب طراحی وب و کارهای گرافیکی.</p><input id="hex" value="#172033"><button onclick="toRgb()">HEX ← RGB</button><input id="rgb" placeholder="23,32,51"><button onclick="toHex()">RGB ← HEX</button><div id="box" style="width:100%;height:100px;border-radius:12px;margin-top:15px"></div><script>function toRgb(){let h=hex.value.replace("#","");if(h.length===3)h=h.split("").map(function(x){return x+x}).join("");if(!/^[0-9a-fA-F]{6}$/.test(h))return;let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4),16);rgb.value=r+", "+g+", "+b;box.style.background="#"+h}function toHex(){let a=rgb.value.split(",").map(function(x){return +x.trim()});if(a.length!==3||a.some(function(x){return x<0||x>255||!Number.isFinite(x)}))return;let h="#"+a.map(function(x){return x.toString(16).padStart(2,"0")}).join("");hex.value=h;box.style.background=h}toRgb()</script></main></body></html>
