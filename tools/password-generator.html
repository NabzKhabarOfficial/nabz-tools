<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد رمز عبور | NABZ Tools</title><meta name="description" content="ساخت رمز عبور تصادفی داخل مرورگر."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>مولد رمز عبور</h1><label>طول <input id="n" type="number" min="6" max="128" value="16"></label><label><input id="u" type="checkbox" checked> حروف بزرگ</label><label><input id="l" type="checkbox" checked> حروف کوچک</label><label><input id="d" type="checkbox" checked> اعداد</label><label><input id="s" type="checkbox" checked> نمادها</label><button onclick="gen()">ساخت رمز</button><input id="o" readonly><script>function gen(){let c="";if(u.checked)c+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";if(l.checked)c+="abcdefghijklmnopqrstuvwxyz";if(d.checked)c+="0123456789";if(s.checked)c+="!@#$%^&*()-_=+[]{}";if(!c){o.value="یک گزینه را انتخاب کنید";return}let a=new Uint32Array(+n.value),x="";crypto.getRandomValues(a);for(let v of a)x+=c[v%c.length];o.value=x.slice(0,+n.value)}</script></main></body></html>
