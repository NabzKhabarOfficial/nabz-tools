<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder Decoder | NABZ Tools</title><meta name="description" content="Encode و Decode کردن متن URL به‌صورت رایگان."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>URL Encoder / Decoder</h1><textarea id="i" placeholder="متن یا URL..."></textarea><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button><textarea id="o" readonly></textarea><script>const input=document.querySelector('#i'),output=document.querySelector('#o');function enc(){output.value=encodeURIComponent(input.value)}function dec(){try{output.value=decodeURIComponent(input.value)}catch(e){output.value="مقدار نامعتبر است."}}</script></main></body></html>
