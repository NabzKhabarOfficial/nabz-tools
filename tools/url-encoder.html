<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder Decoder آنلاین رایگان | NABZ Tools</title><meta name="description" content="Encode و Decode کردن URL و متن برای استفاده در آدرس‌های وب، رایگان و داخل مرورگر."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/url-encoder.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="URL Encoder Decoder آنلاین رایگان | NABZ Tools"><meta property="og:description" content="Encode و Decode کردن URL و متن برای استفاده در آدرس‌های وب، رایگان و داخل مرورگر."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/url-encoder.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>URL Encoder / Decoder</h1><p class="seo-intro">متن یا URL را وارد کن و آن را با encodeURIComponent رمزگذاری یا از حالت encoded خارج کن. این ابزار بدون نصب و بدون سرویس خارجی کار می‌کند.</p><textarea id="i" placeholder="متن یا URL..."></textarea><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button><textarea id="o" readonly></textarea><script>const input=document.querySelector('#i'),output=document.querySelector('#o');function enc(){output.value=encodeURIComponent(input.value)}function dec(){try{output.value=decodeURIComponent(input.value)}catch(e){output.value="مقدار نامعتبر است."}}</script></main></body></html>
