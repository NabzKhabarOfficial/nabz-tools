<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه قیمت طلا با اجرت و مالیات | NABZ Tools</title><meta name="description" content="محاسبه قیمت طلا با وزن، عیار، اجرت، سود و مالیات."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/gold-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/pro4.css"></head><body class="tool-body"><header class="tool-top"><a class="logo" href="../"><b>NABZ</b> Tools</a><div class="tool-top-actions"><a class="tool-top-link" href="../">همه ابزارها</a><button id="themeToggle" class="theme-btn">☾</button></div></header><main class="tool-page"><h1>محاسبه قیمت طلا</h1><p class="seo-intro">وزن و عیار را وارد کن تا قیمت نهایی با اجرت، سود و مالیات حساب شود.</p><div class="card nz-panel"><div class="nz-row3"><label>وزن (گرم)<input id="w" value="5"></label><label>عیار<select id="k"><option value="750">۱۸ عیار</option><option value="875">۲۱ عیار</option><option value="999">۲۴ عیار</option></select></label><label>قیمت هر گرم ۱۸ عیار<input id="p" data-money placeholder="قیمت روز"></label></div><div class="nz-row3"><label>اجرت ٪<input id="o" value="10"></label><label>سود ٪<input id="s" value="7"></label><label>مالیات ٪<input id="t" value="10"></label></div></div><div class="nz-result"><span>قیمت نهایی</span><strong id="out">—</strong><small id="sub"></small></div><div class="card nz-panel"><table class="nz-kv"><tbody id="tb"></tbody></table></div><p class="nz-note">مالیات در این ابزار فقط روی اجرت و سود اعمال می‌شود؛ درصدها را با فاکتور طلافروشی تطبیق بده.</p></main><script src="../assets/nabz.js"></script><script>var $=function(i){return document.getElementById(i)},v=function(i){var x=NZ.num($(i).value);return isFinite(x)?x:0};function c(){var w=v('w'),p=v('p'),b=w*p*+$('k').value/750,o=b*v('o')/100,s=(b+o)*v('s')/100,t=(o+s)*v('t')/100,z=b+o+s+t;out.textContent=p?NZ.money(Math.round(z))+' تومان':'قیمت را وارد کن';tb.innerHTML=[['ارزش خام',b],['اجرت',o],['سود',s],['مالیات',t],['جمع',z]].map(function(x){return '<tr><td>'+x[0]+'</td><td>'+NZ.money(Math.round(x[1]))+' تومان</td></tr>'}).join('')}['w','p','k','o','s','t'].forEach(function(i){$(i).addEventListener('input',c)});fetch('../data/rates.json').then(function(r){return r.json()}).then(function(d){if(d.gold&&d.gold.geram18){p.value=Math.round(d.gold.geram18/10).toLocaleString('en-US');c()}});c()</script></body></html>
