<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاسبه اختلاف دو تاریخ آنلاین رایگان | NABZ Tools</title><meta name="description" content="محاسبه تعداد روز بین دو تاریخ به‌صورت آنلاین و رایگان."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/date-difference.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="محاسبه اختلاف دو تاریخ آنلاین رایگان | NABZ Tools"><meta property="og:description" content="محاسبه تعداد روز بین دو تاریخ به‌صورت آنلاین و رایگان."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/date-difference.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>اختلاف دو تاریخ</h1><p class="seo-intro">دو تاریخ را انتخاب کن تا فاصله آن‌ها بر حسب روز محاسبه شود. این ابزار برای برنامه‌ریزی و محاسبات سریع تقویمی کاربرد دارد.</p><input id="a" type="date"><input id="b" type="date"><button onclick="calc()">محاسبه</button><p id="o"></p><script>const start=document.querySelector('#a'),end=document.querySelector('#b'),output=document.querySelector('#o');function calc(){let x=new Date(start.value),y=new Date(end.value);if(Number.isNaN(x.getTime())||Number.isNaN(y.getTime()))return;output.textContent=Math.abs(Math.round((y-x)/86400000))+" روز"}</script></main></body></html>
