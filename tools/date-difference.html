<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختلاف دو تاریخ | NABZ Tools</title><meta name="description" content="محاسبه تعداد روز بین دو تاریخ."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>اختلاف دو تاریخ</h1><input id="a" type="date"><input id="b" type="date"><button onclick="calc()">محاسبه</button><p id="o"></p><script>function calc(){let x=new Date(a.value),y=new Date(b.value);if(isNaN(x)||isNaN(y))return;o.textContent=Math.abs(Math.round((y-x)/86400000))+" روز"}</script></main></body></html>
