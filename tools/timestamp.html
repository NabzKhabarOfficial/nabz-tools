<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Converter | NABZ Tools</title><meta name="description" content="تبدیل Unix Timestamp و تاریخ به‌صورت رایگان."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>مبدل Unix Timestamp</h1><input id="ts" type="number" placeholder="مثلاً 1750000000"><button onclick="fromTs()">Timestamp → تاریخ</button><input id="dt" type="datetime-local"><button onclick="toTs()">تاریخ → Timestamp</button><p id="o"></p><script>const ts=document.querySelector('#ts'),dt=document.querySelector('#dt'),output=document.querySelector('#o');function fromTs(){let n=+ts.value;if(!Number.isFinite(n))return;output.textContent=new Date(n*1000).toLocaleString("fa-IR")}function toTs(){let d=new Date(dt.value);if(Number.isNaN(d.getTime()))return;output.textContent=Math.floor(d.getTime()/1000)}</script></main></body></html>
