<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مبدل Unix Timestamp آنلاین رایگان | NABZ Tools</title><meta name="description" content="تبدیل Unix Timestamp به تاریخ و تبدیل تاریخ و زمان به Timestamp به‌صورت رایگان."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/timestamp.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="مبدل Unix Timestamp آنلاین رایگان | NABZ Tools"><meta property="og:description" content="تبدیل Unix Timestamp به تاریخ و تبدیل تاریخ و زمان به Timestamp به‌صورت رایگان."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/timestamp.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>مبدل Unix Timestamp</h1><p class="seo-intro">Timestamp یونیکس را به تاریخ محلی تبدیل کن یا تاریخ و زمان را به مقدار Unix Timestamp تبدیل کن. محاسبات مستقیماً در مرورگر انجام می‌شوند.</p><input id="ts" type="number" placeholder="مثلاً 1750000000"><button onclick="fromTs()">Timestamp → تاریخ</button><input id="dt" type="datetime-local"><button onclick="toTs()">تاریخ → Timestamp</button><p id="o"></p><script>const ts=document.querySelector('#ts'),dt=document.querySelector('#dt'),output=document.querySelector('#o');function fromTs(){let n=+ts.value;if(!Number.isFinite(n))return;output.textContent=new Date(n*1000).toLocaleString("fa-IR")}function toTs(){let d=new Date(dt.value);if(Number.isNaN(d.getTime()))return;output.textContent=Math.floor(d.getTime()/1000)}</script></main></body></html>
