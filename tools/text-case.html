<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبدیل حروف بزرگ و کوچک آنلاین | Text Case | NABZ Tools</title><meta name="description" content="تبدیل متن انگلیسی به lowercase، UPPERCASE و Title Case به‌صورت آنلاین و رایگان."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/text-case.html"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:title" content="تبدیل حروف بزرگ و کوچک آنلاین | Text Case | NABZ Tools"><meta property="og:description" content="تبدیل متن انگلیسی به lowercase، UPPERCASE و Title Case به‌صورت آنلاین و رایگان."><meta property="og:url" content="https://nabzkhabarofficial.github.io/nabz-tools/tools/text-case.html"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>تبدیل حالت متن</h1><p class="seo-intro">متن انگلیسی را وارد کن و حالت حروف را با یک کلیک تغییر بده. مناسب ویرایش سریع عنوان‌ها، متن و داده‌های متنی.</p><textarea id="i" placeholder="متن انگلیسی..."></textarea><button onclick="low()">lowercase</button><button onclick="up()">UPPERCASE</button><button onclick="titleCase()">Title Case</button><textarea id="o" readonly></textarea><script>const input=document.querySelector('#i'),output=document.querySelector('#o');function low(){output.value=input.value.toLowerCase()}function up(){output.value=input.value.toUpperCase()}function titleCase(){output.value=input.value.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()})}</script></main></body></html>
