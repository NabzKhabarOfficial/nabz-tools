<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبدیل حالت متن | NABZ Tools</title><meta name="description" content="تبدیل حروف انگلیسی به بزرگ، کوچک و Title Case."><link rel="stylesheet" href="../style.css"></head><body><main class="tools"><a href="../">← بازگشت</a><h1>تبدیل حالت متن</h1><textarea id="i" placeholder="متن انگلیسی..."></textarea><button onclick="low()">lowercase</button><button onclick="up()">UPPERCASE</button><button onclick="titleCase()">Title Case</button><textarea id="o" readonly></textarea><script>function low(){o.value=i.value.toLowerCase()}function up(){o.value=i.value.toUpperCase()}function titleCase(){o.value=i.value.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()})}</script></main></body></html>
