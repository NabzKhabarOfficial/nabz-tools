<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بررسی کد ملی، کارت بانکی و شبا | NABZ Tools</title><meta name="description" content="بررسی صحت کد ملی، شماره کارت بانکی و شماره شبا با تشخیص بانک، داخل مرورگر."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/iran-validator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/pro4.css"></head><body class="tool-body"><header class="tool-top"><a class="logo" href="../"><b>NABZ</b> Tools</a><div class="tool-top-actions"><a class="tool-top-link" href="../">همه ابزارها</a><button id="themeToggle" class="theme-btn">☾</button></div></header><main class="tool-page"><h1>بررسی کد ملی، کارت و شبا</h1><p class="seo-intro">درستی رقم کنترل را داخل مرورگر بررسی کن؛ اطلاعات ارسال نمی‌شود.</p><div class="nz-tabs" id="tabs"><button class="nz-tab active" data-m="nc">کد ملی</button><button class="nz-tab" data-m="cd">کارت</button><button class="nz-tab" data-m="sh">شبا</button></div><div class="card nz-panel"><label id="lab">کد ملی ۱۰ رقمی<input id="in" class="ltr" placeholder="0012345678"></label></div><div class="nz-result"><span>نتیجه</span><strong id="out">عدد را وارد کن</strong><small id="sub"></small></div><p class="nz-note">این ابزار فقط فرمول و رقم کنترل را بررسی می‌کند؛ معتبر بودن به معنی فعال بودن حساب نیست.</p></main><script src="../assets/nabz.js"></script><script>var $=function(i){return document.getElementById(i)},m='nc',BIN={'603799':'ملی','603770':'کشاورزی','589210':'سپه','627353':'تجارت','603769':'صادرات','610433':'ملت','622106':'پارسیان','502229':'پاسارگاد','621986':'سامان','502806':'شهر'},IB={'017':'ملی','016':'کشاورزی','015':'سپه','018':'تجارت','019':'صادرات','012':'ملت','054':'پارسیان','057':'پاسارگاد','056':'سامان','061':'شهر'};function dig(s){return NZ.en(s).replace(/\D/g,'')}function card(d){var z=0;for(var i=0;i<16;i++){var x=+d[15-i];if(i%2){x*=2;if(x>9)x-=9}z+=x}return z%10===0}function run(){var d=dig($('in').value),ok=false,msg='';if(m==='nc'){if(d.length!==10){msg='کد ملی باید ۱۰ رقم باشد.'}else{var s=0;for(var i=0;i<9;i++)s+=+d[i]*(10-i);var r=s%11;ok=+d[9]===(r<2?r:11-r);msg=ok?'کد ملی معتبر است':'کد ملی نامعتبر است'}}else if(m==='cd'){ok=d.length===16&&card(d);msg=ok?'کارت معتبر است'+(BIN[d.slice(0,6)]?'، بانک '+BIN[d.slice(0,6)]:''):'شماره کارت نامعتبر است'}else{var t=NZ.en($('in').value).toUpperCase().replace(/\s/g,'');if(/^\d{24}$/.test(t))t='IR'+t;if(!/^IR\d{24}$/.test(t))msg='شبا باید IR و ۲۴ رقم باشد';else{var x=t.slice(4)+'1827'+t.slice(2,4),r=0;for(var i=0;i<x.length;i++)r=(r*10+ +x[i])%97;ok=r===1;msg=ok?'شبا معتبر است'+(IB[t.slice(4,7)]?'، بانک '+IB[t.slice(4,7)]:''):'شبا نامعتبر است'}}$('out').textContent=d?(ok?'✓ '+msg:'✗ '+msg):'عدد را وارد کن';$('out').className=ok?'nz-ok':d?'nz-bad':''}$('in').addEventListener('input',run);document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){m=b.dataset.m;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('active',x===b)});$('in').value='';run()}});run()</script></body></html>
