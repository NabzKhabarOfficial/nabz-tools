<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قیمت دلار، سکه و طلا امروز | NABZ Tools</title><meta name="description" content="قیمت امروز دلار، تتر، یورو، سکه و طلای ۱۸ عیار بازار آزاد ایران."><link rel="canonical" href="https://nabzkhabarofficial.github.io/nabz-tools/tools/market-prices.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/pro4.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[]}</script></head><body class="tool-body"><header class="tool-top"><a class="logo" href="../"><b>NABZ</b> Tools</a><div class="tool-top-actions"><a class="tool-top-link" href="../">همه ابزارها</a><button id="themeToggle" class="theme-btn">☾</button></div></header><main class="tool-page"><h1>قیمت طلا، سکه و ارز امروز</h1><p class="seo-intro">نرخ بازار آزاد ایران برای دلار، تتر، ارزهای پرکاربرد، سکه و طلای ۱۸ عیار.</p><div class="nz-tabs" id="tabs"><button class="nz-tab active">همه</button><button class="nz-tab">طلا و سکه</button><button class="nz-tab">ارزها</button></div><input id="q" placeholder="جستجو: دلار، سکه، درهم…"><div class="nz-meta" id="meta">در حال دریافت نرخ‌ها…</div><div class="mk-grid" id="grid"></div><p class="nz-note">نرخ‌ها تقریبی‌اند و هر دو ساعت به‌روز می‌شوند. روزهای تعطیل، نرخ ارز با قیمت لحظه‌ای تتر تنظیم می‌شود.</p><div class="actions"><a class="btn" href="currency-converter.html">تبدیل ارز</a><a class="btn ghost" href="gold-calculator.html">محاسبه طلا</a></div></main><script src="../assets/nabz.js"></script><script>fetch('../data/rates.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var a=Object.assign({},d.market,d.gold),names={usd:'دلار آمریکا',usdt:'تتر',eur:'یورو',gbp:'پوند',aed:'درهم',try:'لیر',sekee:'سکه امامی',sekeb:'سکه بهار آزادی',nim:'نیم سکه',rob:'ربع سکه',geram18:'طلای ۱۸ عیار'},g=document.getElementById('grid'),q=document.getElementById('q');function draw(){var w=NZ.norm(q.value),h='';Object.keys(a).filter(function(k){return !w||NZ.norm((names[k]||k)).indexOf(w)>=0}).forEach(function(k){h+='<div class="mk-tile hl"><small>'+(names[k]||k.toUpperCase())+'</small><b>'+NZ.money(Math.round(a[k]/10))+'<i>تومان</i></b></div>'});g.innerHTML=h||'<p>موردی پیدا نشد.</p>'}q.addEventListener('input',draw);document.getElementById('meta').textContent='بازار ایران: '+(d.market_ts||'آخرین داده')+(d.usd_mode==='tether'?' | نرخ ارز با تتر به‌روز شده':'');draw()}).catch(function(){document.getElementById('meta').textContent='دریافت نرخ‌ها ناموفق بود.'})</script></body></html>
