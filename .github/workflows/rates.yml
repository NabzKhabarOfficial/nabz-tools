name: Update currency rates
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest rates
        run: python scripts/update_rates.py
      - name: Validate site
        run: python tests/validate_site.py
      - name: Commit rates
        run: |
          git config user.name "nabz-rates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update currency rates"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
